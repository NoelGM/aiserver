<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi IA</title>

<style>

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    background: #f5f5f7;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: white;
    padding: 12px 18px;
    border-bottom: 1px solid #ddd;
}

.headerTop {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 20px;
}

/* Tabs */

.tabs {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.tab {
    background: #e5e5ea;
    color: #333;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 15px;
}

.tab.active {
    background: #007aff;
    color: white;
}

/* General buttons */

button {
    border: none;
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 15px;
    cursor: pointer;
}

#newChat {
    background: #e5e5ea;
}

/* Chat */

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 900px;
    width: 100%;
    box-sizing: border-box;
    margin: auto;
}

.message {
    margin-bottom: 16px;
    padding: 12px 15px;
    border-radius: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user {
    background: #d9ecff;
    margin-left: 15%;
}

.assistant {
    background: white;
    margin-right: 15%;
    border: 1px solid #ddd;
}

/* Chat input */

#inputArea {
    background: white;
    border-top: 1px solid #ddd;
    padding: 12px;
    display: flex;
    gap: 8px;
}

#message {
    flex: 1;
    resize: none;
    border: 1px solid #ccc;
    border-radius: 12px;
    padding: 11px;
    font-size: 16px;
    min-height: 44px;
}

#send {
    background: #007aff;
    color: white;
    min-width: 70px;
}

#send:disabled {
    opacity: 0.5;
}

/* Image */

#imagePanel {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    box-sizing: border-box;
    max-width: 900px;
    width: 100%;
    margin: auto;
}

#imagePrompt {
    width: 100%;
    min-height: 120px;
    box-sizing: border-box;
    resize: vertical;
    border: 1px solid #ccc;
    border-radius: 12px;
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
}

.imageControls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

#generateImage {
    background: #007aff;
    color: white;
    flex: 1;
}

#generateImage:disabled {
    opacity: 0.5;
}

#imageStatus {
    margin-top: 15px;
    color: #555;
}

#generatedImage {
    display: none;
    width: 100%;
    margin-top: 20px;
    border-radius: 12px;
}

.hidden {
    display: none !important;
}


#editPanel {
    max-width: 900px;
    margin: 20px auto;
    padding: 16px;
}
#editPanel textarea {
    box-sizing: border-box;
    width: 100%;
    min-height: 110px;
    margin: 12px 0;
}
#editImageInput {
    display: block;
    max-width: 100%;
    margin: 16px 0;
}
#editPreview, #editedImage {
    display: block;
    max-width: 100%;
    max-height: 65vh;
    object-fit: contain;
    margin: 12px 0;
    border-radius: 8px;
}
#editedImage {
    display: none;
}
#editStatus {
    margin: 12px 0;
    overflow-wrap: anywhere;
}

</style>
</head>


<body>

<header>

    <div class="headerTop">

        <h1>🤖 Mi IA</h1>

        <button id="newChat">
            Nueva conversación
        </button>

    </div>

    <div class="tabs">

        <button
            id="chatTab"
            class="tab active">
            💬 Chat
        </button>

        <button
            id="imageTab"
            class="tab">
            🎨 Imagen
        </button>

        <button id="editTab" class="tab">🪄 Editar imagen</button>

    </div>

</header>


<!-- CHAT -->

<div id="chatView">

    <div id="chat"></div>

    <div id="inputArea">

        <textarea
            id="message"
            placeholder="Escribe tu pregunta..."
        ></textarea>

        <button id="send">
            Enviar
        </button>

    </div>

</div>


<!-- IMAGE -->

<div id="imageView" class="hidden">

    <div id="imagePanel">

        <h2>🎨 Generar imagen</h2>

        <textarea
            id="imagePrompt"
            placeholder="Describe la imagen que quieres generar..."
        >A beautiful realistic landscape of Toledo, Spain, at sunset, cinematic photography</textarea>

        <div class="imageControls">

            <button id="generateImage">
                Generar imagen
            </button>

        </div>

        <div id="imageStatus"></div>

        <img
            id="generatedImage"
            alt="Imagen generada"
        >

    </div>

</div>



<div id="editView" class="hidden">
    <div id="editPanel">
        <h2>🪄 Editar imagen</h2>
        <p>Selecciona una fotografía y describe los cambios que quieres realizar.</p>
        <input id="editImageInput" type="file" accept="image/*">
        <div id="editPreviewContainer" class="hidden">
            <p>Fotografía original:</p>
            <img id="editPreview" alt="Fotografía seleccionada">
        </div>
        <textarea id="editPrompt"
            placeholder="Ej.: Añade luz cálida de atardecer y un fondo natural, conservando el rostro y la identidad."></textarea>
        <div class="imageControls">
            <button id="editImageButton">Editar imagen</button>
        </div>
        <div id="editStatus"></div>
        <img id="editedImage" alt="Fotografía editada">
    </div>
</div>

<script>

/* =========================
   CHAT CONFIGURATION
   ========================= */

const API_URL =
    `http://${window.location.hostname}:8080/v1/chat/completions`;

const MODEL =
    "mlx-community/gpt-oss-20b-OptiQ-4bit";


/* =========================
   IMAGE CONFIGURATION
   ========================= */

const IMAGE_GENERATE_API = `http://${window.location.hostname}:8090/generate`;
const IMAGE_EDIT_API = `http://${window.location.hostname}:8090/edit`;


/* =========================
   CHAT STATE
   ========================= */

let messages =
    JSON.parse(
        localStorage.getItem("mlx_conversation") || "[]"
    );


const chat =
    document.getElementById("chat");

const input =
    document.getElementById("message");

const send =
    document.getElementById("send");

const newChat =
    document.getElementById("newChat");


/* =========================
   TABS
   ========================= */

const chatTab =
    document.getElementById("chatTab");

const imageTab =
    document.getElementById("imageTab");

const chatView =
    document.getElementById("chatView");

const imageView =
    document.getElementById("imageView");

const editTab = document.getElementById("editTab");
const editView = document.getElementById("editView");


function showChat() {
    chatTab.classList.add("active");
    imageTab.classList.remove("active");
    editTab.classList.remove("active");
    chatView.classList.remove("hidden");
    imageView.classList.add("hidden");
    editView.classList.add("hidden");
    newChat.style.display = "block";
    input.focus();
}

function showImages() {
    chatTab.classList.remove("active");
    imageTab.classList.add("active");
    editTab.classList.remove("active");
    chatView.classList.add("hidden");
    imageView.classList.remove("hidden");
    editView.classList.add("hidden");
    newChat.style.display = "none";
}

function showEdit() {
    chatTab.classList.remove("active");
    imageTab.classList.remove("active");
    editTab.classList.add("active");
    chatView.classList.add("hidden");
    imageView.classList.add("hidden");
    editView.classList.remove("hidden");
    newChat.style.display = "none";
}

/* =========================
   CHAT FUNCTIONS
   ========================= */

function saveConversation() {

    localStorage.setItem(
        "mlx_conversation",
        JSON.stringify(messages)
    );
}


function showMessage(role, text) {

    const div =
        document.createElement("div");

    div.className =
        "message " + role;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


function redraw() {

    chat.innerHTML = "";

    messages.forEach(message => {

        if (
            message.role === "user" ||
            message.role === "assistant"
        ) {

            showMessage(
                message.role,
                message.content
            );

        }

    });

}


function extractFinalAnswer(content) {

    if (!content) {
        return "";
    }

    /*
    GPT-OSS devuelve:

    <|channel|>analysis
    ...
    <|end|>
    <|start|>assistant
    <|channel|>final
    <|message|>
    RESPUESTA
    */

    const marker =
        "<|channel|>final<|message|>";

    if (content.includes(marker)) {

        content =
            content.split(marker)[1];

    }

    content =
        content.replace(
            /<\|end\|>[\s\S]*$/,
            ""
        );

    return content.trim();
}


async function sendMessage() {

    const text =
        input.value.trim();

    if (!text || send.disabled) {
        return;
    }

    input.value = "";

    messages.push({
        role: "user",
        content: text
    });

    showMessage(
        "user",
        text
    );

    saveConversation();

    send.disabled = true;
    send.textContent = "...";

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            model: MODEL,
                            messages: messages,
                            max_tokens: 500,
                            stream: false
                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Respuesta MLX:",
            data
        );


        if (
            !data.choices ||
            !data.choices[0] ||
            !data.choices[0].message
        ) {

            throw new Error(
                "Formato de respuesta inesperado"
            );

        }


        const raw =
            data.choices[0].message.content;


        const answer =
            extractFinalAnswer(raw);


        if (!answer) {

            throw new Error(
                "GPT-OSS no devolvió una respuesta final"
            );

        }


        messages.push({
            role: "assistant",
            content: answer
        });


        showMessage(
            "assistant",
            answer
        );


        saveConversation();

    }

    catch (error) {

        console.error(error);

        showMessage(
            "assistant",
            "❌ Error: " + error.message
        );

    }

    finally {

        send.disabled = false;
        send.textContent = "Enviar";

        input.focus();

    }

}


/* =========================
   IMAGE GENERATION
   ========================= */

const imagePrompt =
    document.getElementById("imagePrompt");

const generateImageButton =
    document.getElementById("generateImage");

const imageStatus =
    document.getElementById("imageStatus");

const generatedImage =
    document.getElementById("generatedImage");


async function generateImage() {

    const prompt =
        imagePrompt.value.trim();

    if (
        !prompt ||
        generateImageButton.disabled
    ) {
        return;
    }


    generateImageButton.disabled = true;
    generateImageButton.textContent =
        "Generando...";

    imageStatus.textContent =
        "⏳ Generando imagen...";

    generatedImage.style.display =
        "none";


    try {

        const response =
            await fetch(
                IMAGE_GENERATE_API,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            prompt: prompt,
                            width: 1024,
                            height: 1024,
                            steps: 4
                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const blob =
            await response.blob();


        const imageUrl =
            URL.createObjectURL(blob);


        generatedImage.src =
            imageUrl;

        generatedImage.style.display =
            "block";


        imageStatus.textContent =
            "✅ Imagen generada.";

    }

    catch (error) {

        console.error(error);

        imageStatus.textContent =
            "❌ Error: " + error.message;

    }

    finally {

        generateImageButton.disabled =
            false;

        generateImageButton.textContent =
            "Generar imagen";

    }

}



/* =========================
   IMAGE EDITING
   ========================= */

const editImageInput = document.getElementById("editImageInput");
const editPrompt = document.getElementById("editPrompt");
const editImageButton = document.getElementById("editImageButton");
const editStatus = document.getElementById("editStatus");
const editPreview = document.getElementById("editPreview");
const editPreviewContainer = document.getElementById("editPreviewContainer");
const editedImage = document.getElementById("editedImage");

editImageInput.addEventListener("change", function () {
    const file = editImageInput.files[0];
    editedImage.style.display = "none";

    if (!file) {
        editPreviewContainer.classList.add("hidden");
        return;
    }

    editPreview.src = URL.createObjectURL(file);
    editPreviewContainer.classList.remove("hidden");
    editStatus.textContent = "Fotografía seleccionada.";
});

async function editImage() {
    const file = editImageInput.files[0];
    const prompt = editPrompt.value.trim();

    if (!file) {
        editStatus.textContent = "Selecciona primero una fotografía.";
        return;
    }

    if (!prompt || editImageButton.disabled) {
        editStatus.textContent = "Escribe los cambios que deseas realizar.";
        return;
    }

    editImageButton.disabled = true;
    editImageButton.textContent = "Editando...";
    editStatus.textContent = "⏳ Editando la fotografía. Puede tardar un poco...";
    editedImage.style.display = "none";

    try {
        const imageData = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error("No se pudo leer la fotografía."));
            reader.readAsDataURL(file);
        });

        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, 1536 / bitmap.width, 1536 / bitmap.height);
        const width = Math.max(256, Math.round(bitmap.width * scale));
        const height = Math.max(256, Math.round(bitmap.height * scale));
        bitmap.close();

        const response = await fetch(IMAGE_EDIT_API, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                prompt: prompt,
                image: imageData,
                width: width,
                height: height,
                steps: 4
            })
        });

        if (!response.ok) {
            let detail = "";
            try {
                const errorData = await response.json();
                detail = errorData.error || "";
            } catch (_) {}
            throw new Error("HTTP " + response.status +
                (detail ? ": " + detail : ""));
        }

        const blob = await response.blob();
        editedImage.src = URL.createObjectURL(blob);
        editedImage.style.display = "block";
        editStatus.textContent = "✅ Fotografía editada correctamente.";

    } catch (error) {
        console.error(error);
        editStatus.textContent = "❌ Error: " + error.message;
    } finally {
        editImageButton.disabled = false;
        editImageButton.textContent = "Editar imagen";
    }
}

editImageButton.addEventListener("click", editImage);


/* =========================
   EVENT LISTENERS
   ========================= */

send.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


newChat.addEventListener(
    "click",
    function() {

        if (
            confirm(
                "¿Borrar esta conversación y empezar una nueva?"
            )
        ) {

            messages = [];

            localStorage.removeItem(
                "mlx_conversation"
            );

            redraw();

        }

    }
);


chatTab.addEventListener(
    "click",
    showChat
);


imageTab.addEventListener(
    "click",
    showImages
);

editTab.addEventListener("click", showEdit);


generateImageButton.addEventListener(
    "click",
    generateImage
);


/* =========================
   INITIAL STATE
   ========================= */

redraw();

</script>

</body>
</html>
