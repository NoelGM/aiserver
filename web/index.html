<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative AI Server</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <div class="headerTop">
            <h1>🤖 Generative AI Server</h1>
            <button id="newChat">Nueva conversación</button>
        </div>
        <div class="tabs">
            <button id="chatTab" class="tab active">💬 Chat</button>
            <button id="imageTab" class="tab">🎨 Generar imagen</button>
            <button id="editTab" class="tab">🪄 Editar imagen</button>
        </div>
    </header>

    <!-- CHAT -->
    <div id="chatView">
        <div id="chat"></div>
        <div id="inputArea">
            <textarea id="message" placeholder="Escribe tu pregunta..."></textarea>
            <button id="send">Enviar</button>
        </div>
    </div>

    <!-- IMAGE -->
    <div id="imageView" class="hidden">
        <div id="imagePanel">
            <h2>🎨 Generar imagen</h2>
            <textarea id="imagePrompt"
                placeholder="Describe la imagen que quieres generar..."
            >A beautiful realistic landscape of Toledo, Spain, at sunset, cinematic photography</textarea>
            <div class="imageControls">
                <button id="generateImage">Generar imagen</button>
            </div>
            <div id="imageStatus"></div>
            <img id="generatedImage" alt="Imagen generada">
        </div>
    </div>

    <div id="editView" class="hidden">
        <div id="editPanel">
            <h2>🪄 Editar imagen</h2>
            <p>Selecciona una fotografía y describe los cambios que quieres realizar.</p>
            <input id="editImageInput" type="file" accept="image/*">
            <div id="editPreviewContainer" class="hidden">
                <p>Fotografía original:</p>
                <img id="editPreview" alt="Fotografía seleccionada">
            </div>
            <textarea id="editPrompt"
                placeholder="Ej.: Añade luz cálida de atardecer y un fondo natural, conservando el rostro y la identidad."></textarea>
            <div class="imageControls">
                <button id="editImageButton">Editar imagen</button>
            </div>
            <div id="editStatus"></div>
            <img id="editedImage" alt="Fotografía editada">
        </div>
    </div>
</body>
</html>
